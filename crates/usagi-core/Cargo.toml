[package]
name = "usagi-core"
description = "Parser and static analysis for Unreal Engine 2 UnrealScript"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true

[lib]
name = "usagi_core"

[dependencies]
pest = "2.9"
pest_derive = "2.9"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
pest_consume = "1.1"
pest_consume_macros = "1.1"
convert_case = "0.12"
t3d = { git = "https://github.com/DarklightGames/t3d-rs", rev = "3dd7fa2037206641d956b2095e34595dc58e2f37" }
