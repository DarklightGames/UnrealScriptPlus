[package]
name = "usagi-cli"
description = "Command-line parser, linter and mod build tool for Unreal Engine 2 UnrealScript"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["unrealscript", "unreal", "linter", "modding", "cli"]
categories = ["development-tools", "command-line-utilities"]
repository.workspace = true

[[bin]]
name = "usagi"
path = "src/main.rs"

[dependencies]
usagi-core = { path = "../usagi-core", version = "0.3.0" }
usagi-pkg = { path = "../usagi-pkg", version = "0.3.0", features = ["serde"] }
annotate-snippets = "0.11"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
pest = "2.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
toml = "0.8"
walkdir = "2"
crc32fast = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
flate2 = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
