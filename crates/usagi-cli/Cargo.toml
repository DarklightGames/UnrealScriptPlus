[package]
name = "usagi-cli"
description = "Command-line parser and linter for Unreal Engine 2 UnrealScript"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true

[[bin]]
name = "usagi"
path = "src/main.rs"

[dependencies]
usagi-core = { path = "../usagi-core", version = "0.3.0" }
annotate-snippets = "0.11"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
pest = "2.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
