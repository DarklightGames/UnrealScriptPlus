[package]
name = "unrealscript-lsp"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "unrealscript-lsp"
path = "src/main.rs"

[dependencies]
unrealscript_parser = { path = "../unrealscript-parser" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6.0"
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pest = "2.7"
