# Builds the usagi binary for Linux and Windows and attaches it to a GitHub
# release, then publishes usagi-core and usagi-cli to crates.io. Runs when a
# tag like `v0.3.0` is pushed; it can also be run by hand, which builds the
# archives without publishing anything.
#
# Publishing uses crates.io Trusted Publishing: each crate's settings on
# crates.io must list this repository and the `release.yml` workflow.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install the target
      run: rustup target add ${{ matrix.target }}
    - name: Install musl tools
      if: contains(matrix.target, 'musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Build
      run: cargo build --release --locked -p usagi-cli --target ${{ matrix.target }}
    - name: Package (Linux)
      if: runner.os != 'Windows'
      run: |
        name=usagi-${{ github.ref_name }}-${{ matrix.target }}
        mkdir "$name"
        cp target/${{ matrix.target }}/release/usagi README.md LICENSE "$name"/
        tar czf "$name.tar.gz" "$name"
        echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $name = "usagi-${{ github.ref_name }}-${{ matrix.target }}"
        New-Item -ItemType Directory $name | Out-Null
        Copy-Item target/${{ matrix.target }}/release/usagi.exe, README.md, LICENSE $name
        Compress-Archive -Path $name -DestinationPath "$name.zip"
        "ARCHIVE=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ env.ARCHIVE }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes usagi-*

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Check that the tag matches the crate version
      run: |
        version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "usagi-cli") | .version')
        if [ "v$version" != "${{ github.ref_name }}" ]; then
          echo "Tag ${{ github.ref_name }} doesn't match the crate version $version" >&2
          exit 1
        fi
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        cargo publish --locked -p usagi-core
        cargo publish --locked -p usagi-cli
